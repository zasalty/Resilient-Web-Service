events {}

http {
    upstream web_servers {
        server web1:5000 max_fails=1 fail_timeout=5s;
        server web2:5000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://web_servers;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }
    }
}

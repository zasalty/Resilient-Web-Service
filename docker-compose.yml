services:
  web1:
    build: ./web-app
    environment:
      SERVER_NAME: "Web Server 1"
    networks:
      - internal

  web2:
    build: ./web-app
    environment:
      SERVER_NAME: "Web Server 2"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - internal

networks:
  internal:
    driver: bridge
